name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_failure:
        description: "Force the test job to fail so Slack notification delivery can be verified"
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: node --check & integration test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # bat ランチャー前提の Windows 環境もカバーするため 2 OS で検証
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          node --check eh_download.mjs
          node --check convert_images.mjs
          node --check image_viewer.mjs
          node --check run_all.mjs
          node --check run_all_sea_entry.mjs
          node --check sharp_loader.mjs
          node --check build_exe.mjs
          node --check test_eh_download.mjs
          node --check test_convert_images.mjs
          node --check test_image_viewer.mjs
          node --check test_run_all.mjs

      - name: Install conversion test dependency
        run: npm install --no-save sharp

      - name: Integration test (fetch-mocked)
        run: node test_eh_download.mjs

      - name: Image conversion integration test
        run: node test_convert_images.mjs

      - name: Integration test (all-in-one launcher)
        run: node test_run_all.mjs

      # サムネイル生成テスト用 (sharp は optional。無い環境では自動スキップされる)
      - name: Install sharp for viewer thumbnail tests
        run: npm install sharp --no-fund --no-audit

      - name: Integration test (image viewer)
        run: node test_image_viewer.mjs

      - name: Force failure for Slack notification test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_failure }}
        run: exit 1

  docs:
    name: docs consistency check
    # README / docs のアセット名・オプション・アンカーを実際のリリースと照合。
    # gh が使えるよう ubuntu のみで実行 (Windows では gh の PATH 解決が環境依存)。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check docs consistency (assets, options, anchors)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check_docs_consistency.mjs --repo ${{ github.repository }}

  notify:
    name: Notify Slack on failure
    needs: [test, docs]
    # PR では通知せず、main push または明示的な手動実行だけを対象にする
    if: ${{ always() && (needs.test.result == 'failure' || needs.docs.result == 'failure') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2
        with:
          # シークレット SLACK_WEBHOOK_URL に Incoming Webhook URL を設定してください
          # (リポジトリ Settings > Secrets and variables > Actions > New repository secret)
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rotating_light: CI が失敗しました",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *CI が失敗しました* (`${{ github.repository }}`)\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* `${{ github.actor }}`\n*Message:* ${{ github.event.head_commit.message || 'manual workflow_dispatch' }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "失敗した Run を見る" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
