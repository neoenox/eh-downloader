name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node --check & integration test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # bat ランチャー前提の Windows 環境もカバーするため 2 OS で検証
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          node --check eh_download.mjs
          node --check convert_images.mjs
          node --check test_eh_download.mjs

      - name: Integration test (fetch-mocked)
        run: node test_eh_download.mjs
