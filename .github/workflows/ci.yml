name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node --check & integration test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # bat ランチャー前提の Windows 環境もカバーするため 2 OS で検証
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          node --check eh_download.mjs
          node --check convert_images.mjs
          node --check test_eh_download.mjs

      - name: Integration test (fetch-mocked)
        run: node test_eh_download.mjs

      - name: TEMPORARY - force failure to verify Slack notification
        run: exit 1

  notify:
    name: Notify Slack on failure
    needs: test
    # 通知の重複を避けるため PR では発火させず main への push のみ対象
    if: ${{ always() && needs.test.result == 'failure' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2
        with:
          # シークレット SLACK_WEBHOOK_URL に Incoming Webhook URL を設定してください
          # (リポジトリ Settings > Secrets and variables > Actions > New repository secret)
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rotating_light: CI が失敗しました",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *CI が失敗しました* (`${{ github.repository }}`)\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* `${{ github.actor }}`\n*Message:* ${{ github.event.head_commit.message }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "失敗した Run を見る" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
